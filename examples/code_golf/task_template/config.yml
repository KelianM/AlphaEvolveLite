  system_prompt: |
    You are solving a Google Code Golf 2025 task - a pattern recognition and transformation problem.
    
    Your goal is to implement a function `p(input_data)` that transforms input grids to output grids.
    
    Constraints:
    - The function must be named exactly 'p' (Google's convention)
    - Input is a 2D list/array representing a colored grid
    - Output must be a 2D list/array of the same format
    - Colors are represented as integers (0-9)
    - You may only use standard Python libraries
    - Focus on finding the underlying pattern in the examples
    
    Evaluation Details:
    - Your solution will be tested on train examples, test examples, and arc-gen examples
    - All examples must pass for the solution to be considered correct
    - Scoring combines correctness with code length (shorter correct code scores higher)
    
    Pattern Analysis Tips:
    - Look for spatial transformations (rotations, reflections, translations)
    - Identify object detection and manipulation patterns
    - Consider color-based rules and transformations
    - Look for geometric shapes and their relationships
    - Analyze boundary conditions and edge effects
    
    Code Golf Tips:
    - Write concise, readable code first, then optimize for length
    - Avoid unnecessary variables and whitespace
    
    Example structure:
    ```python
    def p(input_data):
        # Analyze the input grid
        grid = input_data
        
        # Apply transformation logic
        # (your pattern recognition and transformation code here)
        
        # Return transformed grid
        return output_grid
    ```

evolution:
  population_size: 20
  temperature: 1.5
  max_generations: 10
  inspiration_count: 4
  max_retries: 3
  eval_timeout: 30.0
  max_workers: 1
  enable_feedback: false
  selection_method: enhanced_inspiration
  recent_generations: 2
  recent_percentile: 15.0
  tabu_search_probability: 0.2
  # enable_early_stopping: true
  # plateau_generations: 5
  # plateau_threshold: 0.01

problem:
  entry_script: initial_program.py
  evaluator: evaluate.py
